name: Deploy docs

# 构建并发布文档站到 GitHub Pages。
#
# 内容来自 main 分支的 skills/fnos-cli（镜像流程维护的那份），
# 站点源码来自 site 分支 —— 这样镜像流程的 force push 永远碰不到站点。
#
# 这份文件需要同时存在两个地方：
#   site 分支：.github/workflows/deploy-docs.yml   → 处理 push 事件
#   main 分支：.github/workflows/deploy-docs.yml   → 定时 / 手动触发只能从默认分支
#
# main 上那份是 sync-upstream.yml 每次同步时自动从本分支复制的产物：
# 只改这里（site 分支），不要手改 main 上的——下次同步会被覆盖回去。

on:
  push:
    branches: [site]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'static/**'
      - 'scripts/**'
      - 'skill-snapshot/**'
      - 'docusaurus.config.ts'
      - 'sidebars.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-docs.yml'
  schedule:
    # 每天 10:23 (UTC+8) 重新拉一次上游内容，防止镜像更新后站点没跟上
    - cron: '23 2 * * *'
  workflow_dispatch:

# 换域名或换仓库时只改这两行
env:
  DOCS_URL: https://fnosp.github.io
  DOCS_BASE_URL: /fnos-cli-skill/
  NODE_VERSION: '22'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site branch
        uses: actions/checkout@v7
        with:
          ref: site
          fetch-depth: 1

      - name: Fetch skill content from main
        id: content
        run: |
          set -euo pipefail
          if git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main 2>/dev/null \
             && git ls-tree -r --name-only refs/remotes/origin/main -- skills/fnos-cli/SKILL.md | grep -q .; then
            mkdir -p .skill-src
            git archive refs/remotes/origin/main skills/fnos-cli | tar -x -C .skill-src
            echo "SKILL_SOURCE=.skill-src/skills/fnos-cli" >> "$GITHUB_ENV"
            echo "source=main" >> "$GITHUB_OUTPUT"
            echo "已从 main 取到 skills/fnos-cli"
          else
            echo "SKILL_SOURCE=skill-snapshot" >> "$GITHUB_ENV"
            echo "source=snapshot" >> "$GITHUB_OUTPUT"
            echo "::warning title=使用快照构建::无法从 main 读取 skills/fnos-cli，本次用仓库内快照构建。"
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync skill docs
        run: npm run sync

      - name: Validate docs structure
        run: npm run check

      # prebuild 会再跑一次 sync（幂等），保证产物与校验内容一致
      - name: Build
        env:
          DOCS_URL: ${{ env.DOCS_URL }}
          DOCS_BASE_URL: ${{ env.DOCS_BASE_URL }}
        run: |
          npm run build
          test -f build/index.html
          test -f build/docs/skill/index.html

      # 提前查一次 Pages 状态。没启用时 configure-pages 只会抛一句
      # "HttpError: Not Found"，看不出要改什么，所以这里先给出能照做的提示。
      - name: Check Pages enablement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages"
          body="$(mktemp)"
          code="$(curl -sS -o "${body}" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}" 2>/dev/null || echo 000)"

          case "${code}" in
            200)
              build_type="$(node -e 'const fs=require("fs");try{process.stdout.write(String((JSON.parse(fs.readFileSync(process.argv[1],"utf8"))||{}).build_type||""))}catch{}' "${body}")"
              if [ "${build_type}" = "workflow" ]; then
                echo "Pages 已启用，构建来源为 GitHub Actions，可以继续。"
              else
                echo "::error title=Pages 构建来源不是 GitHub Actions::当前 build_type=${build_type:-未知}。请到 Settings → Pages → Build and deployment → Source 改成 GitHub Actions（不要选 Deploy from a branch）。"
                exit 1
              fi
              ;;
            404)
              echo "::error title=GitHub Pages 尚未启用::仓库 ${GITHUB_REPOSITORY} 还没有 Pages 站点。请到 Settings → Pages → Build and deployment → Source 选择 GitHub Actions，保存后重新运行本工作流（Re-run jobs 即可，无需改代码）。"
              exit 1
              ;;
            403)
              echo "::warning title=无法确认 Pages 状态::HTTP 403，token 权限不足以读取 Pages 配置。继续尝试部署。"
              ;;
            000)
              echo "::warning title=无法确认 Pages 状态::请求 GitHub API 失败（网络或代理异常）。继续尝试部署。"
              ;;
            *)
              echo "::warning title=无法确认 Pages 状态::HTTP ${code}，继续尝试部署。"
              ;;
          esac

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
